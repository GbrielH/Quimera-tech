      <use href="#jersey-orange" transform="translate(42 57) scale(1.15)"/>
      <use href="#jersey-dark" transform="translate(170 63) scale(1.13)"/>
      <text x="31" y="405" fill="#ff603d" font-family="Arial, sans-serif" font-size="10" font-weight="900" letter-spacing="2">INTERCLASSE</text>
      <text x="31" y="432" fill="#123f46" font-family="Arial Black, Arial, sans-serif" font-size="20" font-weight="900">MODELO 881 · TIGRE</text>
    </g>

    <g transform="translate(377 -20) rotate(4 95 112)" filter="url(#shadow)">
      <rect width="190" height="220" fill="#fffdf8"/>
      <use href="#jersey-dark" transform="translate(18 38) scale(.67)"/>
      <text x="15" y="199" fill="#ff603d" font-family="Arial, sans-serif" font-size="9" font-weight="900" letter-spacing="2">TERCEIRÃO</text>
    </g>

    <g transform="translate(354 308) rotate(-4 92 106)" filter="url(#shadow)">
      <rect width="184" height="212" fill="#fffdf8"/>
      <path d="M37 53 63 37h42l26 16 24 12-13 32-20-7v83H47V90l-20 7-13-32Z" fill="#2864ff" stroke="#184cca" stroke-width="3"/>
      <path d="M63 37c4 15 37 15 42 0" fill="none" stroke="#dfe8ef" stroke-width="7"/>
      <path d="m38 102 95-39M45 133l91-38M56 160l70-29" stroke="#123f46" stroke-width="5" opacity=".65"/>
    </g>

    <g transform="translate(233 425)">
      <rect width="202" height="61" fill="#f2cf4a"/>
      <text x="18" y="38" fill="#123f46" font-family="Arial, sans-serif" font-size="25" font-weight="900">+</text>
      <text x="48" y="27" fill="#123f46" font-family="Arial, sans-serif" font-size="10" font-weight="900">PERSONALIZE CORES,</text>
