    <text x="25" y="34" fill="#fff" font-family="Arial, sans-serif" font-size="13" font-weight="900">EXPLORAR O CATÁLOGO</text>
    <text x="195" y="35" fill="#fff" font-family="Arial, sans-serif" font-size="23">→</text>
  </g>
  <g transform="translate(523 714)" fill="#123f46">
    <circle cx="12" cy="26" r="9" fill="none" stroke="#123f46" stroke-width="2"/>
    <path d="m7 21 2 7 6 3" fill="none" stroke="#123f46" stroke-width="2" stroke-linecap="round"/>
    <text x="35" y="31" font-family="Arial, sans-serif" font-size="13" font-weight="900">CHAMAR NO WHATSAPP</text>
    <rect x="35" y="49" width="185" height="1"/>
