  <line x1="263" y1="817" x2="862" y2="817" stroke="#b9c1bd"/>
  <g fill="#123f46" font-family="Arial Black, Arial, sans-serif" font-weight="900">
    <text x="263" y="852" font-size="23">694</text>
    <text x="468" y="852" font-size="23">100%</text>
    <text x="676" y="852" font-size="23">DIRETO</text>
  </g>
  <g fill="#617577" font-family="Arial, sans-serif" font-size="10" font-weight="700">
