    </filter>
    <linearGradient id="instagram" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#833ab4"/>
      <stop offset=".58" stop-color="#e1306c"/>
      <stop offset="1" stop-color="#ff603d"/>
    </linearGradient>
    <pattern id="jersey-lines" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(32)">
      <rect width="22" height="22" fill="#101b24"/>
      <rect width="5" height="22" fill="#18374c"/>
    </pattern>
    <g id="jersey-dark">
      <path d="M34 18 61 3h48l27 15 32 16-17 39-22-8v100H41V65l-22 8L2 34Z" fill="url(#jersey-lines)" stroke="#061016" stroke-width="4"/>
      <path d="M61 3c3 17 43 17 48 0" fill="none" stroke="#d9e2e6" stroke-width="8"/>
      <path d="m51 83 69-37M48 111l81-44M60 136l62-33" stroke="#2864ff" stroke-width="5" opacity=".75"/>
    </g>
    <g id="jersey-orange">
      <path d="M34 18 61 3h48l27 15 32 16-17 39-22-8v100H41V65l-22 8L2 34Z" fill="#121a20" stroke="#061016" stroke-width="4"/>
      <path d="M61 3c3 17 43 17 48 0" fill="none" stroke="#d9e2e6" stroke-width="8"/>
      <path d="M42 46c37 13 67 42 88 78M39 82c29 8 58 32 86 69M67 23c16 11 31 24 44 41" fill="none" stroke="#f28b16" stroke-width="8" opacity=".9"/>
