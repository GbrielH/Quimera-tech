  <text x="1025" y="23" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="1">CHAMAR NO WHATSAPP  →</text>

  <g transform="translate(278 46)" fill="#123f46">
    <path d="M12 0h26c24 0 38 10 38 26 0 11-7 19-18 23 15 4 23 13 23 27 0 20-17 31-46 31H12Zm20 19v23h7c11 0 17-4 17-12s-6-11-17-11Zm0 41v28h10c13 0 19-5 19-14s-7-14-20-14Z"/>
    <path d="M3 4h7v100H3z"/>
    <path d="m5 86 61-49 6 7-61 50z" fill="#f5f0e6"/>
    <text x="-1" y="119" font-family="Arial, sans-serif" font-size="13" font-weight="900" letter-spacing="1">BRANDS</text>
    <text x="12" y="132" font-family="Arial, sans-serif" font-size="9" font-weight="800" letter-spacing="1.2">SPORT</text>
