<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 900" role="img" aria-labelledby="title desc">
  <title id="title">Página inicial da Brands Sports</title>
  <desc id="desc">Miniatura do site de uniformes personalizados da Brands Sports.</desc>
  <defs>
